<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ek Sawal ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:'Poppins',sans-serif;
text-align:center;
}

h1{
font-family:'Playfair Display',serif;
font-style:italic;
font-size:40px;
color:#ff2d75;
margin-bottom:40px;
}

button{
padding:12px 30px;
font-size:20px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

.yes{
background:#ff2d75;
color:white;
}

.yes:hover{
transform:scale(1.1);
}

#no{
background:white;
color:#ff2d75;
position:absolute;
}

</style>

</head>

<body>

<h1>Do you want to know more about yourself?? ❤️</h1>

<button class="yes" onclick="openPage()">Yes</button>

<button id="no">No</button>

<script>

function openPage(){

window.location.href="shayari.html"

}

let no=document.getElementById("no")

no.onmouseover=function(){

no.style.left=Math.random()*500+"px"
no.style.top=Math.random()*400+"px"

}

</script>

</body>
</html>
